<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The EV Hub</title>
<meta name="description" content="The EV Hub: football statistics, model probabilities, fair odds and expected value. Demo mode: sample data, not live betting odds.">
<meta name="theme-color" content="#090D0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The EV Hub">
<meta name="application-name" content="The EV Hub">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>:root{--bg:#090D0B;--panel:#111714;--panel2:#161E1A;--panel3:#1C2621;--line:#24302A;--line2:#2E3B34;--text:#FFFFFF;--muted:#9AA8A0;--dim:#6E7B74;
--pos:#39E58C;--neg:#FF5C65;--zero:#8D9792;--acc:#39E58C;--acc2:#2BC277;--warn:#F2C14E;--r:14px;--top:56px;--bot:64px;--safe-b:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;overflow-x:hidden;min-height:100vh}
body.noscroll{overflow:hidden}
a{color:var(--text)}a:hover{color:var(--acc)}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px;line-height:1.15}h2{font-size:18px;margin:18px 0 8px;letter-spacing:-.01em}h3{font-size:15px;margin:18px 0 8px}
.muted{color:var(--muted)}.xs{font-size:12px}.warn{color:var(--warn)}.nw{white-space:nowrap}
/* demo bar + header */
.demobar{position:sticky;top:0;z-index:40;background:#1A1405;color:var(--warn);font:700 11px/1 -apple-system,sans-serif;letter-spacing:.08em;text-align:center;padding:7px 10px;border-bottom:1px solid #3A2E0C}
header.top{position:sticky;top:25px;z-index:35;display:flex;align-items:center;gap:12px;height:var(--top);padding:0 16px;background:rgba(9,13,11,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.logo{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,#1B2A22,#0C120F);border:1px solid #2F4A3B;color:var(--acc);font:900 13px/1 -apple-system,sans-serif;letter-spacing:-.03em;box-shadow:inset 0 0 0 1px rgba(57,229,140,.08)}
.bname{font-size:17px}
.topnav{display:none;margin-left:auto;gap:2px}.topnav a,.botnav a{text-decoration:none;color:var(--muted)}
.topnav a{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:600}.topnav a svg{width:17px;height:17px}
.topnav a.on,.topnav a:hover{color:var(--text);background:var(--panel2)}.topnav a.on svg{stroke:var(--acc)}
.topact{margin-left:auto;display:flex;gap:6px}.iconbtn{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;color:var(--muted);border:1px solid var(--line)}.iconbtn.on{color:var(--acc);border-color:#2F4A3B}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.iconbtn svg{width:19px;height:19px}
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:35;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--bot) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(10,14,12,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.botnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600}.botnav a svg{width:22px;height:22px}.botnav a.on{color:var(--text)}.botnav a.on svg{stroke:var(--acc)}
main{padding:16px 16px calc(var(--bot) + var(--safe-b) + 28px);max-width:1280px;margin:0 auto;outline:none}
@media (min-width:1000px){.topnav{display:flex}.topact{display:none}.botnav{display:none}main{padding:24px 28px 60px}}
/* building */
.splash{min-height:70vh;display:grid;place-items:center;text-align:center}.splash .logo{width:64px;height:64px;font-size:24px;border-radius:18px;margin:0 auto 14px}.splash p{color:var(--muted)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--acc);animation:sp 0.8s linear infinite;margin:14px auto}@keyframes sp{to{transform:rotate(360deg)}}
/* pieces */
.phead{margin:2px 0 12px}.phead p{margin:4px 0 0}.back{display:inline-block;margin-bottom:6px;color:var(--muted);text-decoration:none;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px;min-width:0}
.card h2{margin-top:0}.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}.ch h2{margin:0}
.banner{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.banner.demo{background:#17130A;border-color:#3A2E0C;color:#F5DFA0}.banner.demo b{color:var(--warn)}
.demotag{display:inline-block;font:800 10px/1 -apple-system,sans-serif;letter-spacing:.06em;color:var(--warn);border:1px solid #4A3A10;background:#16120A;border-radius:6px;padding:4px 6px;vertical-align:middle;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:600 14px/1.1 inherit;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#3A4A41}.btn.on{border-color:var(--acc);color:var(--acc)}.btn.acc{background:var(--acc);border-color:var(--acc);color:#04140B}.btn.acc:hover{background:#4CF09B;color:#04140B}
.btn.ghost{background:transparent}.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:9px}.btn.wide{width:100%;margin-top:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--acc);color:#04140B;font-size:11px;font-weight:800}
.linkbtn{background:none;border:0;padding:0;color:var(--text);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;font:inherit;cursor:pointer}
.in{width:100%;min-height:42px;padding:9px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--bg);color:var(--text);font:16px/1.2 inherit}
.in:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);font:600 13px/1.1 inherit;cursor:pointer;text-decoration:none}
.chip.on{color:var(--text);border-color:var(--acc);background:#11241A}.chip small{color:var(--dim)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.seg button{min-height:34px;padding:6px 12px;border:0;border-radius:9px;background:none;color:var(--muted);font:600 13px/1.1 inherit;cursor:pointer}.seg button.on{background:var(--panel3);color:var(--text);box-shadow:inset 0 0 0 1px #2F4A3B}
.ck{display:flex;align-items:flex-start;gap:8px;padding:6px 0;cursor:pointer;font-size:14px}.ck input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--acc);flex:0 0 auto}.ck.dis{opacity:.6;cursor:default}
.empty{text-align:center;padding:40px 16px;border:1px dashed var(--line2);border-radius:var(--r)}.empty .btn{margin-top:10px}
/* EV colours: meaningful only */
.ev-pos{color:var(--pos)}.ev-neg{color:var(--neg)}.ev-zero,.ev-na{color:var(--zero)}
.ev-posbg{background:var(--pos)}.ev-negbg{background:#5A2A2E}
.conf{display:inline-block;font-size:12px;font-weight:700;padding:3px 7px;border-radius:7px;border:1px solid var(--line2)}.conf-high{color:var(--text);border-color:#3C5B4A}.conf-medium{color:#D4DBD7}.conf-low{color:var(--muted);border-style:dashed}
.lg{display:inline-block;font:800 10px/1 -apple-system,sans-serif;letter-spacing:.04em;padding:4px 6px;border-radius:6px;background:var(--panel3);color:#CFD8D3;border:1px solid var(--line2);vertical-align:1px}
.form{display:inline-flex;gap:3px}.form i{font-style:normal;display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 3px;border-radius:6px;font-size:11px;font-weight:700}.form .fh{background:#16301F;color:#BFF5D7}.form .fm{background:var(--panel3);color:var(--dim)}
.dot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;margin-right:3px;font-size:12px}.dot.fh{background:#16301F}.dot.fm{background:var(--panel3);color:var(--dim)}
.minetag{font-size:10px;font-weight:800;color:var(--acc);border:1px solid #2F4A3B;border-radius:5px;padding:1px 4px;margin-left:3px;vertical-align:1px}
/* tables */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);max-width:100%;overscroll-behavior-x:contain}
.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.tbl tr:first-child th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;z-index:2}
.tbl .n{text-align:right}.tbl th.sel{position:sticky;left:0;z-index:1;background:var(--panel);min-width:150px;max-width:210px;white-space:normal;box-shadow:1px 0 0 var(--line)}
.tbl tr:first-child th.sel{z-index:3;background:var(--panel2)}
.tbl th.sel b{display:block;font-size:14px}.tbl th.sel small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:1px}
.tbl tr[data-detail],.tbl tr[data-player],.tbl tr[data-team]{cursor:pointer}.tbl tr[data-detail]:hover td,.tbl tr[data-detail]:hover th.sel,.tbl tr[data-player]:hover td,.tbl tr[data-team]:hover td{background:#141C18}
.tbl td small{color:var(--muted)}.tbl .cfx span{display:block;max-width:220px;overflow:hidden;text-overflow:ellipsis}.tbl .cfx small{display:block}
.tbl.compact th,.tbl.compact td{padding:7px 9px}.tbl tr.dim th,.tbl tr.dim td{color:var(--dim)}.tbl tr.stale td,.tbl tr.stale th{opacity:.55}.tbl tr.chosen td,.tbl tr.chosen th.sel{background:#102018}
.sorth{background:none;border:0;padding:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}.sorth.on{color:var(--acc)}
.pos{display:inline-block;min-width:18px;color:var(--muted)}.wdl{font-style:normal;display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:5px;font-size:11px;font-weight:800;margin-right:2px;background:var(--panel3);color:var(--muted)}.w-W{background:#16301F;color:#BFF5D7}.w-L{background:#2E1719;color:#FFC2C6}
/* explorer */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px;border-bottom:1px solid var(--line)}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:11px 12px;border:0;background:none;color:var(--muted);font:700 14px/1 inherit;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}.tab.on{color:var(--text);border-bottom-color:var(--acc)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}.toolbar .search{flex:1 1 220px}.toolbar select.in{flex:1 1 160px;width:auto}
.sortl{display:flex;flex-direction:column;gap:2px;flex:1 1 200px}.sortl select.in{flex:none;width:100%}.tbtns{display:flex;gap:6px;flex-wrap:wrap}
.fpanel,.colpanel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 0 12px}
.colpanel{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 12px}
.fgrid{display:grid;grid-template-columns:1fr;gap:12px}@media (min-width:720px){.fgrid{grid-template-columns:1fr 1fr}.fgrid .wide{grid-column:1/-1}}
.fr{display:flex;flex-direction:column;gap:6px;min-width:0}.flab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}.flab small{font-weight:500}
.rng{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.rng .in{flex:1 1 90px;width:auto}.rng span{color:var(--dim);font-size:13px}
.fxbox{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:11px;padding:2px 10px;background:var(--bg)}.fxbox .ck small{color:var(--muted)}
.presets .plist{display:flex;flex-wrap:wrap;gap:6px}.pitem{display:inline-flex;align-items:center;gap:4px}
.basisrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.reshead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 8px}.reshead p{margin:0}
/* dashboard */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:18px;margin:0 0 12px;border-radius:18px;border:1px solid var(--line);background:radial-gradient(120% 140% at 100% 0%,rgba(57,229,140,.13),transparent 55%),linear-gradient(180deg,#101713,#0B100D)}
.hero h1{font-size:34px}.eyebrow{margin:0 0 4px;color:var(--acc);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.herocta{display:flex;gap:8px;flex-wrap:wrap}
.dashf{display:flex;flex-wrap:wrap;gap:12px 20px;margin:0 0 12px}.dashf>div{display:flex;flex-direction:column;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px}@media (min-width:720px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (min-width:1000px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}@media (min-width:620px){.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}}.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0;display:flex;flex-direction:column;gap:3px}.kpi small{color:var(--muted);font-size:12px;font-weight:600}.kpi b{font-size:22px;letter-spacing:-.02em;line-height:1.15}.kpi.sm b{font-size:18px}.kpi b small{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}@media (min-width:1000px){.grid2{grid-template-columns:1fr 1fr}.grid2 .wide{grid-column:1/-1}}.grid2>.card{margin:0}
.toplist,.mvlist,.fxlist,.alist{list-style:none;margin:0;padding:0}
.toplist li,.mvlist li,.alist li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.toplist li:last-child,.mvlist li:last-child{border-bottom:0}
.toplist{counter-reset:t}.toplist li::before{counter-increment:t;content:counter(t);flex:0 0 22px;height:22px;display:grid;place-items:center;border-radius:7px;background:var(--panel3);color:var(--muted);font-size:12px;font-weight:800}
.toplist li>div:first-of-type,.mvlist li>div:first-child,.alist li>div:first-child{flex:1;min-width:0}.toplist small,.mvlist small,.alist small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;font-size:13px;white-space:nowrap}
.fxlist li a{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none}.fxlist small{color:var(--muted)}
.hist{display:flex;align-items:flex-end;gap:6px;height:130px;padding:8px 0}.hist .hb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}.hist .hb i{width:100%;border-radius:5px 5px 2px 2px;min-height:2px}.hist .hb small{font-size:10px;color:var(--muted)}.hist .hb b{font-size:11px}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.srcs{display:grid;grid-template-columns:1fr;gap:8px}@media (min-width:720px){.srcs{grid-template-columns:repeat(2,1fr)}}
.src{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--panel2)}.src span{font-size:13px}.src small{color:var(--muted);font-size:12px}.src.on{border-color:#2F4A3B}.src.on span{color:var(--acc)}.src.off span{color:var(--muted)}
/* fixtures */
.dayh{margin:18px 0 8px}.fxgrid{display:grid;grid-template-columns:1fr;gap:10px}@media (min-width:640px){.fxgrid{grid-template-columns:repeat(2,1fr)}}@media (min-width:1000px){.fxgrid{grid-template-columns:repeat(3,1fr)}}
.fxcard{display:block;text-decoration:none;margin:0}.fxcard:hover{border-color:#2F4A3B;color:var(--text)}.fxtop{display:flex;justify-content:space-between}.fxteams{display:flex;flex-direction:column;margin:8px 0;font-size:16px}
.fx3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.fx3 span{background:var(--panel2);border-radius:9px;padding:6px;text-align:center;font-weight:700}.fx3 small{display:block;color:var(--muted);font-size:11px;font-weight:600}
.nextfx{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.nextfx>div{display:flex;flex-direction:column}
/* sheet */
.sheetwrap{position:fixed;inset:0;z-index:60}.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:28px;background:var(--bg);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 16px calc(28px + var(--safe-b));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px)}}@media (min-width:1000px){.sheet{left:auto;top:0;width:720px;border-radius:0;border-left:1px solid var(--line2);border-top:0;padding:24px}}
.sheetx{position:sticky;top:0;float:right;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font-size:16px;cursor:pointer}
.dhead h2{margin:8px 0 2px;font-size:24px}.dhead p{margin:2px 0}.dsel{font-size:16px}.dctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.pbar{position:relative;height:6px;border-radius:3px;background:var(--panel3);margin-top:6px}.pbar .pr{position:absolute;top:0;bottom:0;background:#3B4A42;border-radius:3px}.pbar .pp{position:absolute;top:-3px;width:2px;height:12px;background:var(--text);border-radius:1px}
.kelly .krow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}.kelly .field{display:flex;flex-direction:column;gap:4px;width:140px}
.why p{margin:0 0 8px}.warnlist{margin:0;padding-left:18px;color:#D9E0DC;font-size:14px}.warnlist li{margin:3px 0}
.doc{margin:6px 0;padding-left:20px}.doc li{margin:6px 0}
/* charts */
.chartwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px 6px 2px;margin:0 0 10px}
.chartwrap svg{display:block}.bhit{fill:var(--pos);opacity:.85}.bno{fill:#3A4741}.bneu{fill:#5D6B64}.bmiss{fill:var(--dim)}.blab{fill:#DDE5E0;font-size:10px;text-anchor:middle;font-weight:700}.bax{fill:var(--dim);font-size:9px;text-anchor:middle}
.bline{stroke:#fff;stroke-dasharray:4 4;stroke-width:1.2;opacity:.75}.bltxt{fill:#fff;font-size:10px;font-weight:700}
.spark{vertical-align:middle}.spark polyline{stroke:var(--muted);stroke-width:1.6}.spark.up polyline{stroke:#CFD8D3}.mv{font-size:12px;color:var(--muted)}.mvup,.mvdn{color:#DDE5E0}
/* alerts */
.alist li.blocked{opacity:.6}
.booknotes{margin:8px 0;padding-left:18px}
/* toasts */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + var(--safe-b) + 14px);z-index:80;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px)}
.toast{background:var(--panel3);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity .5s}.toast.out{opacity:0}
@media (min-width:1000px){#toasts{bottom:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.toplist li,.mvlist li,.alist li{flex-wrap:wrap}.toplist li .tr,.mvlist li .tr,.alist li .tr{width:100%;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;text-align:left}.toplist li .tr{padding-left:32px}}
</style>
</head>
<body>
<div class="splash" id="splash"><div><span class="logo">EV</span><h1>The EV Hub</h1><div class="spin"></div><p>Building the demo data…</p><p class="xs">DEMO MODE — SAMPLE DATA, NOT LIVE BETTING ODDS</p></div></div>
<noscript><p style="padding:20px">The EV Hub needs JavaScript.</p></noscript>
<script>/* The EV Hub — core helpers (no dependencies). Everything lives on window.EV. */
'use strict';
const EV = (window.EV = window.EV || {});
EV.VERSION = '7aa4d8b97c';
EV.DEMO = true; // Phase 1: every figure comes from the bundled synthetic dataset

// ---------- small helpers
EV.$ = (s, r = document) => r.querySelector(s);
EV.$$ = (s, r = document) => [...r.querySelectorAll(s)];
EV.esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
EV.clamp = (x, a, b) => Math.max(a, Math.min(b, x));
EV.sum = a => a.reduce((t, x) => t + x, 0);
EV.mean = a => (a.length ? EV.sum(a) / a.length : null);
EV.num = v => (v === '' || v == null || !Number.isFinite(Number(v)) ? null : Number(v));
EV.uniq = a => [...new Set(a)];
EV.byKey = (a, k) => Object.fromEntries(a.map(x => [x[k], x]));

// ---------- seeded random numbers (the demo data is identical on every visit)
EV.rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
EV.hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
EV.normal = r => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
EV.gammaS = (r, k) => { // Marsaglia–Tsang, k > 0
  if (k < 1) return EV.gammaS(r, k + 1) * Math.pow(r(), 1 / k);
  const d = k - 1 / 3, c = 1 / Math.sqrt(9 * d);
  for (;;) { let x, v; do { x = EV.normal(r); v = 1 + c * x; } while (v <= 0); v = v * v * v; const u = r(); if (u < 1 - 0.0331 * x ** 4 || Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v; }
};
EV.poisS = (r, lam) => { if (lam <= 0) return 0; if (lam > 30) return Math.max(0, Math.round(lam + Math.sqrt(lam) * EV.normal(r))); const L = Math.exp(-lam); let k = 0, p = 1; do { k++; p *= r(); } while (p > L); return k - 1; };
EV.nbS = (r, mean, disp) => (mean <= 0 ? 0 : EV.poisS(r, EV.gammaS(r, disp) * (mean / disp))); // negative binomial (Poisson–gamma)

// ---------- probability distributions (used by the demo model)
const LF = [0]; for (let i = 1; i < 400; i++) LF[i] = LF[i - 1] + Math.log(i);
EV.lgamma = z => { // Lanczos
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - EV.lgamma(1 - z);
  z -= 1; let x = c[0]; for (let i = 1; i < g + 2; i++) x += c[i] / (z + i); const t = z + g + 0.5;
  return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
};
EV.poisPmf = (k, lam) => (lam <= 0 ? (k === 0 ? 1 : 0) : Math.exp(-lam + k * Math.log(lam) - (LF[k] ?? EV.lgamma(k + 1))));
EV.nbPmf = (k, mean, disp) => { if (mean <= 0) return k === 0 ? 1 : 0; if (!Number.isFinite(disp) || disp > 1e6) return EV.poisPmf(k, mean); const p = disp / (disp + mean); return Math.exp(EV.lgamma(k + disp) - EV.lgamma(disp) - (LF[k] ?? EV.lgamma(k + 1)) + disp * Math.log(p) + k * Math.log(1 - p)); };
EV.pmfArr = (mean, disp, max) => { // recurrence: fast enough to price tens of thousands of selections on a phone
  const a = new Array(max + 1).fill(0); if (mean <= 0) { a[0] = 1; return a; }
  if (!Number.isFinite(disp) || disp > 1e6) { a[0] = Math.exp(-mean); for (let k = 1; k <= max; k++) a[k] = (a[k - 1] * mean) / k; }
  else { const p = disp / (disp + mean); a[0] = Math.pow(p, disp); for (let k = 1; k <= max; k++) a[k] = (a[k - 1] * (k - 1 + disp) * (1 - p)) / k; }
  const s = EV.sum(a); if (s < 1) a[max] += 1 - s; return a; };
EV.conv = (a, b) => { const out = new Array(a.length + b.length - 1).fill(0); a.forEach((x, i) => b.forEach((y, j) => { out[i + j] += x * y; })); return out; };
EV.atLeast = (pmf, k) => EV.clamp(EV.sum(pmf.slice(Math.max(0, k))), 0, 1);

// ---------- odds: decimal internally; fractional ladder like UK bookmakers
EV.LADDER = [[1, 20], [1, 16], [1, 12], [1, 10], [1, 9], [1, 8], [2, 15], [1, 7], [1, 6], [2, 11], [1, 5], [2, 9], [1, 4], [2, 7], [3, 10], [1, 3], [4, 11], [2, 5], [4, 9], [1, 2], [8, 15], [4, 7], [8, 13], [4, 6], [8, 11], [4, 5], [5, 6], [10, 11], [1, 1], [21, 20], [11, 10], [6, 5], [5, 4], [11, 8], [6, 4], [13, 8], [7, 4], [15, 8], [2, 1], [9, 4], [5, 2], [11, 4], [3, 1], [10, 3], [7, 2], [4, 1], [9, 2], [5, 1], [11, 2], [6, 1], [13, 2], [7, 1], [15, 2], [8, 1], [9, 1], [10, 1], [11, 1], [12, 1], [14, 1], [16, 1], [18, 1], [20, 1], [25, 1], [33, 1], [40, 1], [50, 1], [66, 1], [80, 1], [100, 1]].map(([a, b]) => ({ a, b, dec: 1 + a / b }));
EV.snapDown = dec => { let best = EV.LADDER[0]; for (const s of EV.LADDER) if (s.dec <= dec + 1e-9) best = s; return best.dec; }; // bookmakers round in their own favour
EV.fracOf = dec => { const s = EV.LADDER.find(x => Math.abs(x.dec - dec) < 0.004); if (s) return s.a === s.b ? 'Evens' : `${s.a}/${s.b}`; const f = dec - 1; for (const den of [1, 2, 4, 5, 8, 10, 20, 100]) { const n = Math.round(f * den); if (Math.abs(n / den - f) < 0.006) { const g = gcd(n, den); return `${n / g}/${den / g}`; } } return `${(f * 100).toFixed(0)}/100`; };
function gcd(a, b) { return b ? gcd(b, a % b) : Math.abs(a) || 1; }
EV.amerOf = dec => (dec >= 2 ? `+${Math.round((dec - 1) * 100)}` : `−${Math.round(100 / (dec - 1))}`);
EV.fmtOdds = (dec, fmt = EV.settings ? EV.settings.oddsFmt : 'dec') => { if (!Number.isFinite(dec) || dec <= 1) return '—'; return fmt === 'frac' ? EV.fracOf(dec) : fmt === 'amer' ? EV.amerOf(dec) : dec.toFixed(2); };
EV.parseOdds = t => { const s = String(t ?? '').trim().toLowerCase().replace(/\s+/g, '').replace(',', '.'); if (!s) return null; if (['evens', 'evs', 'ev'].includes(s)) return 2;
  let m = /^(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/.exec(s); if (m) { const v = 1 + Number(m[1]) / Number(m[2]); return Number.isFinite(v) && v > 1 ? v : null; }
  m = /^([+-−])(\d+)$/.exec(s); if (m) { const a = Number(m[2]); if (a < 100) return null; return m[1] === '+' ? 1 + a / 100 : 1 + 100 / a; }
  const d = Number(s); return Number.isFinite(d) && d > 1 ? d : null; };

// ---------- the EV maths (documented in the app and README)
EV.fair = p => (p > 0 ? 1 / p : null);
EV.evPct = (p, O) => (p > 0 && O > 1 ? (p * O - 1) * 100 : null); // EV (%) = (p × O − 1) × 100
EV.kelly = (p, O) => (p > 0 && O > 1 ? (p * O - 1) / (O - 1) : null); // full Kelly fraction of bankroll (negative = no bet)

// ---------- formatting
EV.pct = (x, d = 1) => (x == null || !Number.isFinite(x) ? '—' : x > 0 && x < 0.001 ? '<0.1%' : `${(x * 100).toFixed(d)}%`);
EV.sgn = (x, d = 1) => (x == null || !Number.isFinite(x) ? '—' : `${x > 0 ? '+' : x < 0 ? '−' : ''}${Math.abs(x).toFixed(d)}%`);
EV.evCls = x => (x == null ? 'ev-na' : x > 0.05 ? 'ev-pos' : x < -0.05 ? 'ev-neg' : 'ev-zero');
EV.gbp = x => `£${Number(x).toFixed(2)}`;
EV.f1 = x => (x == null || !Number.isFinite(x) ? '—' : Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : x.toFixed(1));
const UK = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const UKD = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short' });
const UKT = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit' });
const UKY = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' });
EV.ymd = t => UKY.format(new Date(t));
EV.fmtKO = t => UK.format(new Date(t)).replace(',', '');
EV.fmtDay = t => UKD.format(new Date(t));
EV.fmtTime = t => UKT.format(new Date(t));
EV.dayWord = t => { const d = EV.ymd(t), n = EV.ymd(Date.now()), tm = EV.ymd(Date.now() + 864e5); return d === n ? 'Today' : d === tm ? 'Tomorrow' : EV.fmtDay(t); };
EV.ago = t => { const m = Math.round((Date.now() - t) / 6e4); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${m % 60} min ago`; };

// ---------- local storage (wrapped: private browsing can refuse it)
EV.load = (k, d) => { try { const v = localStorage.getItem('evhub.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
EV.save = (k, v) => { try { localStorage.setItem('evhub.' + k, JSON.stringify(v)); return true; } catch { return false; } };
EV.sload = (k, d) => { try { const v = sessionStorage.getItem('evhub.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
EV.ssave = (k, v) => { try { sessionStorage.setItem('evhub.' + k, JSON.stringify(v)); } catch { /* this visit only */ } };

/* The EV Hub — settings, Explorer filters, presets (kept in this browser only). */
'use strict';
(() => {
const EV = window.EV;
EV.ago = t => { const m = Math.max(0, Math.round((EV.NOW - t) / 6e4)); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${m % 60} min ago`; };

const DEF_SETTINGS = { oddsFmt: 'dec', myBooks: ['b365', 'pp', 'mgm', 'bfx'], basis: 'mine', commission: 5, kellyDiv: 10, bankroll: 100, cols: null, dashLeagues: [], dashBasis: 'mine' };
EV.settings = { ...DEF_SETTINGS, ...EV.load('settings', {}) };
EV.saveSettings = () => EV.save('settings', EV.settings);
EV.resetSettings = () => { EV.settings = { ...DEF_SETTINGS }; EV.saveSettings(); };

EV.COLS = [ // Explorer columns: [key, header, default visible]
  ['fixture', 'Fixture & kick-off', true], ['league', 'League', true], ['market', 'Market', true], ['line', 'Line', true], ['hit', 'Hit rate', true], ['form', 'Recent form', true],
  ['prob', 'Model prob.', true], ['fair', 'Fair odds', true], ['best', 'Best odds', true], ['book', 'Bookmaker', true], ['ev', 'EV %', true], ['bestAll', 'Best (all books)', false],
  ['conf', 'Confidence', true], ['sample', 'Sample', true], ['score', 'Best Overall', false], ['updated', 'Last odds update', true], ['link', 'Bookmaker link', true], ['action', 'Details', true]];
EV.visibleCols = () => { const c = EV.settings.cols; return EV.COLS.filter(([k, , d]) => k === 'prob' || (c ? c.includes(k) : d)).map(([k]) => k); }; // the model probability is always shown

EV.SORTS = [['evDesc', 'Highest positive EV'], ['evAsc', 'Lowest EV'], ['pDesc', 'Highest model probability'], ['pAsc', 'Lowest model probability'], ['best', 'Best Overall (illustrative)'], ['hitDesc', 'Highest historical hit rate'], ['oddsDesc', 'Highest bookmaker odds'], ['ko', 'Earliest kick-off'], ['name', 'Player / team name']];
EV.DEF_FILTERS = { tab: 'player', when: 'all', leagues: [], fixtures: [], q: '', markets: [], pMin: '', pMax: '', evMin: '', evMax: '', fairMin: '', fairMax: '', oddsMin: '', oddsMax: '',
  hitMin: '', hitWin: 'l10', sampleMin: '', books: 'basis', bookList: [], evSign: 'all', venue: 'all', minsMin: '', confMin: 'any', priced: false, sort: 'best' };
EV.filters = { ...EV.DEF_FILTERS, ...EV.load('filters', {}) };
EV.saveFilters = () => EV.save('filters', EV.filters);
EV.presets = () => EV.load('presets', []);
EV.savePresets = a => EV.save('presets', a);
/** The bookmaker ids whose prices count right now (Explorer). */
EV.activeBooks = (f = EV.filters) => (f.books === 'custom' && f.bookList.length ? f.bookList : (f.books === 'all' || (f.books === 'basis' && EV.settings.basis === 'all')) ? EV.BOOKS.map(b => b.id) : EV.settings.myBooks.length ? EV.settings.myBooks : EV.BOOKS.map(b => b.id));
EV.basisLabel = (f = EV.filters) => (f.books === 'custom' && f.bookList.length ? `${f.bookList.length} chosen bookmakers` : (f.books === 'all' || (f.books === 'basis' && EV.settings.basis === 'all')) ? 'all bookmakers' : 'my bookmakers');
})();

/* The EV Hub — shared UI pieces: chips, charts, the detail sheet, toasts. */
'use strict';
(() => {
const EV = window.EV, esc = EV.esc;
EV.leagueName = id => (EV.LEAGUES.find(l => l.id === id) || {}).name || id;
EV.leagueBadge = id => `<span class="lg lg-${esc(id)}">${esc((EV.LEAGUES.find(l => l.id === id) || {}).short || id)}</span>`;
EV.fxName = fx => `${EV.TEAM[fx.home].name} v ${EV.TEAM[fx.away].name}`;
EV.demoTag = (txt = 'DEMO DATA — NOT LIVE ODDS') => `<span class="demotag">${esc(txt)}</span>`;
EV.evHtml = (e, d = 1) => `<b class="${EV.evCls(e)}">${e == null ? 'EV n/a' : EV.sgn(e, d)}</b>`;
EV.confHtml = c => (c ? `<span class="conf conf-${c.label.toLowerCase()}" title="Confidence score ${c.score} of 6">${c.label}</span>` : '—');
EV.chips = (name, items, sel, multi = true) => `<div class="chips" data-chips="${esc(name)}" data-multi="${multi ? 1 : 0}">${items.map(([v, l]) => `<button type="button" class="chip${(multi ? sel.includes(v) : sel === v) ? ' on' : ''}" data-v="${esc(v)}" aria-pressed="${multi ? sel.includes(v) : sel === v}">${esc(l)}</button>`).join('')}</div>`;
EV.seg = (name, items, cur) => `<div class="seg" data-seg="${esc(name)}" role="group">${items.map(([v, l]) => `<button type="button" data-v="${esc(v)}" class="${String(v) === String(cur) ? 'on' : ''}" aria-pressed="${String(v) === String(cur)}">${esc(l)}</button>`).join('')}</div>`;
EV.formHtml = (vals, hits) => `<span class="form">${vals.map((v, i) => `<i class="${hits[i] ? 'fh' : 'fm'}" title="${hits[i] ? 'hit' : 'miss'}">${esc(String(v))}</i>`).join('')}</span>`;

/** Bar chart: values (oldest first) against a line; missing values drawn as a gap (never as zero). */
EV.barChart = (pts, line, opts = {}) => { const h = opts.h || 120, w = Math.max(240, pts.length * 28), vals = pts.map(p => p.v).filter(v => v != null), mx = Math.max(line != null ? line * 1.3 : 1, ...vals, 1), bw = w / Math.max(1, pts.length);
  const y = v => h - 18 - (v / mx) * (h - 32);
  const bars = pts.map((p, i) => { const x = i * bw + bw * 0.15, ww = bw * 0.7; if (p.v == null) return `<g><rect x="${x}" y="${h - 22}" width="${ww}" height="2" class="bmiss"/><text x="${x + ww / 2}" y="${h - 26}" class="blab">–</text><title>${esc(p.label)}: not recorded</title></g>`;
    const hit = opts.hit ? opts.hit(p.v) : null; return `<g><rect x="${x}" y="${y(p.v)}" width="${ww}" height="${Math.max(1, h - 18 - y(p.v))}" rx="2" class="${hit == null ? 'bneu' : hit ? 'bhit' : 'bno'}"/><text x="${x + ww / 2}" y="${y(p.v) - 3}" class="blab">${esc(EV.f1(p.v))}</text><text x="${x + ww / 2}" y="${h - 5}" class="bax">${esc(p.short || '')}</text><title>${esc(p.label)}: ${esc(EV.f1(p.v))}</title></g>`; }).join('');
  const ln = line != null ? `<line x1="0" x2="${w}" y1="${y(line)}" y2="${y(line)}" class="bline"/><text x="${w - 2}" y="${y(line) - 4}" class="bltxt" text-anchor="end">${esc(opts.lineLabel || String(line))}</text>` : '';
  return `<div class="chartwrap"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(opts.aria || 'Match by match chart')}">${bars}${ln}</svg></div>`; };
/** Small line of earlier prices. */
EV.spark = (hist, w = 70, h = 22) => { if (!hist || hist.length < 2) return ''; const mn = Math.min(...hist), mx = Math.max(...hist), sp = mx - mn || 1, pts = hist.map((v, i) => `${((i / (hist.length - 1)) * (w - 2) + 1).toFixed(1)},${(h - 2 - ((v - mn) / sp) * (h - 4)).toFixed(1)}`).join(' ');
  const up = hist[hist.length - 1] > hist[hist.length - 2], dn = hist[hist.length - 1] < hist[hist.length - 2];
  return `<svg class="spark ${up ? 'up' : dn ? 'dn' : ''}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}"/></svg>`; };
EV.moveHtml = pr => { if (!pr.prev || pr.prev === pr.odds) return '<span class="mv">no change</span>'; const up = pr.odds > pr.prev; return `<span class="mv ${up ? 'mvup' : 'mvdn'}">${up ? '▲' : '▼'} from ${esc(EV.fmtOdds(pr.prev))}</span>`; };
/** Probability bar (white): p with its 80% range. */
EV.probBar = m => (m && m.ok ? `<div class="pbar" title="Model ${EV.pct(m.p)} (range ${EV.pct(m.pLo, 0)}–${EV.pct(m.pHi, 0)})"><i class="pr" style="left:${m.pLo * 100}%;width:${Math.max(0.5, (m.pHi - m.pLo) * 100)}%"></i><i class="pp" style="left:${m.p * 100}%"></i></div>` : '');

EV.toast = (msg, kind = '') => { let t = EV.$('#toasts'); if (!t) { t = document.createElement('div'); t.id = 'toasts'; document.body.appendChild(t); } const d = document.createElement('div'); d.className = `toast ${kind}`; d.innerHTML = msg; t.appendChild(d); setTimeout(() => d.classList.add('out'), 3800); setTimeout(() => d.remove(), 4400); };

/** A full-height sheet (phone) / side panel (desktop). Back closes it. */
EV.sheet = (html, onClose) => { EV.closeSheet(true); const w = document.createElement('div'); w.className = 'sheetwrap'; w.innerHTML = `<div class="sheetbg" data-close></div><section class="sheet" role="dialog" aria-modal="true"><button type="button" class="sheetx" data-close aria-label="Close">✕</button><div class="sheetin">${html}</div></section>`;
  document.body.appendChild(w); document.body.classList.add('noscroll'); EV._sheet = { w, onClose }; try { history.pushState({ evsheet: 1 }, ''); } catch { /* fine */ }
  w.addEventListener('click', e => { if (e.target.closest('[data-close]')) { history.state && history.state.evsheet ? history.back() : EV.closeSheet(); } }); return w.querySelector('.sheetin'); };
EV.closeSheet = quiet => { const s = EV._sheet; if (!s) return; s.w.remove(); document.body.classList.remove('noscroll'); EV._sheet = null; if (!quiet && s.onClose) s.onClose(); };
addEventListener('popstate', () => { if (EV._sheet) EV.closeSheet(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && EV._sheet) { history.state && history.state.evsheet ? history.back() : EV.closeSheet(); } });

// chips / segmented controls: one delegated handler per container, calling back with the new value(s)
EV.bindChips = (root, onChange) => root.addEventListener('click', e => { const b = e.target.closest('[data-chips] .chip, [data-seg] button'); if (!b || !root.contains(b)) return;
  const box = b.closest('[data-chips], [data-seg]'), name = box.dataset.chips || box.dataset.seg;
  if (box.dataset.seg) { box.querySelectorAll('button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); }); onChange(name, b.dataset.v); return; }
  const multi = box.dataset.multi === '1'; if (!multi) box.querySelectorAll('.chip').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); }); else { b.classList.toggle('on'); b.setAttribute('aria-pressed', b.classList.contains('on')); }
  onChange(name, multi ? [...box.querySelectorAll('.chip.on')].map(x => x.dataset.v) : b.dataset.v); });

/** Draw a page again on a fresh element, so its old event listeners go with the old element. */
EV.rerender = (root, view) => { const fresh = root.cloneNode(false); root.replaceWith(fresh); view(fresh); return fresh; };
// remembered scroll positions per page (restored when you come back)
EV.scrollKey = () => location.hash || '#/';
addEventListener('scroll', () => { if (!EV._sheet) EV.ssave('scroll:' + EV.scrollKey(), scrollY); }, { passive: true });
EV.restoreScroll = () => { const y = EV.sload('scroll:' + EV.scrollKey(), 0); requestAnimationFrame(() => scrollTo(0, y)); };
})();

window.EV.buildData = function () {
/* The EV Hub — DEMO DATA. A synthetic football world, generated the same way on every visit from a fixed seed.
 * Fictional clubs and players in five real competition names; nothing here is real football history or real bookmaker prices.
 * The generator keeps the "true" rates it used, so demo bookmaker prices and the demo model are internally consistent:

/* The EV Hub — Alerts (settings + a local demo simulator) and Settings. No phone notifications are sent in Phase 1. */
'use strict';
(() => {
const EV = window.EV, esc = EV.esc;
const DEF_RULES = { evMin: 5, leagues: [], cats: ['player', 'team', 'match'], markets: [], books: [], pMin: 40, confMin: 'Medium', oddsImprove: 5, newOnly: true, dedupMin: 60, perHour: 10, maxAgeMin: 15, telegram: false, push: false };
EV.alertRules = () => ({ ...DEF_RULES, ...EV.load('alerts', {}) });
let feed = EV.sload('alertFeed', []), tick = EV.sload('alertTick', 0), sent = EV.sload('alertSent', {});

/** One simulated "price update": a deterministic set of demo prices change, then the rules are checked with dedupe, staleness and rate limits. */
function simulate(R) {
  tick++; const rng = EV.rng(9000 + tick), now = EV.NOW + tick * 5 * 6e4, out = [], books = R.books.length ? R.books : EV.settings.myBooks, cRank = { any: 0, Low: 1, Medium: 2, High: 3 };
  const cands = EV.ROWS.filter(r => r.m.ok && (!R.leagues.length || R.leagues.includes(r.league)) && R.cats.includes(r.cat) && (!R.markets.length || R.markets.includes(r.mk)) && r.m.p * 100 >= R.pMin && cRank[r.m.conf.label] >= cRank[R.confMin]);
  for (let i = 0; i < 40 && cands.length; i++) {
    const r = cands[Math.floor(rng() * cands.length)], prs = r.prices.filter(p => books.includes(p.bk)); if (!prs.length) continue;
    const pr = prs[Math.floor(rng() * prs.length)], step = rng() < 0.55 ? 1 : rng() < 0.5 ? 2 : -1, idx = EV.LADDER.findIndex(s => Math.abs(s.dec - pr.odds) < 1e-6), nd = EV.LADDER[EV.clamp(idx + step, 0, EV.LADDER.length - 1)].dec;
    const age = rng() < 0.15 ? R.maxAgeMin + 5 + rng() * 60 : rng() * 4, q = { ...pr, prev: pr.odds, odds: nd, at: now - age * 6e4 }, ev = EV.rowEv(r.m, EV.effOdds(q)), imp = (nd / pr.odds - 1) * 100;
    const hit = ev >= R.evMin || (R.oddsImprove > 0 && imp >= R.oddsImprove && ev > 0); if (!hit) continue;
    const key = `${r.id}|${pr.bk}`, item = { t: now, row: r.id, bk: pr.bk, odds: nd, prev: pr.odds, ev, imp, why: ev >= R.evMin ? `EV ${EV.sgn(ev)} ≥ ${R.evMin}%` : `price up ${imp.toFixed(1)}%` };
    if (age > R.maxAgeMin) item.blocked = `stale price (${Math.round(age)} min old)`;
    else if (sent[key] && now - sent[key].t < R.dedupMin * 6e4 && !(nd > sent[key].odds)) item.blocked = 'duplicate (already alerted at this price or better)';
    else if (feed.filter(x => !x.blocked && now - x.t < 36e5).length + out.filter(x => !x.blocked).length >= R.perHour) item.blocked = `rate limit (${R.perHour} an hour)`;
    if (!item.blocked) sent[key] = { t: now, odds: nd };
    out.push(item);
  }
  feed = out.concat(feed).slice(0, 80); EV.ssave('alertFeed', feed); EV.ssave('alertTick', tick); EV.ssave('alertSent', sent); return out;
}

      <div class="fr"><span class="flab">Betfair Exchange commission (%)</span><input class="in" inputmode="decimal" data-s="commission" value="${S.commission}"></div></section>
    <section class="card"><h2>Stake calculator</h2><div class="fr"><span class="flab">Bankroll (£)</span><input class="in" inputmode="decimal" data-s="bankroll" value="${S.bankroll}"></div><div class="fr"><span class="flab">Default Kelly fraction</span>${EV.seg('kellyDiv', [['10', '1/10'], ['15', '1/15'], ['20', '1/20']], String(S.kellyDiv))}</div></section>
    <section class="card"><h2>Data sources</h2><div class="srcs">
      <div class="src on"><b>Demo data</b><span>Active (Phase 1)</span><small>Synthetic clubs, players, statistics and prices. Nothing is real.</small></div>
      <div class="src off"><b>OddsAPI.dev</b><span>Phase 2 · not connected</span><small>Odds only. Needs a private backend for the API key. See PHASE-2-PLAN.md.</small></div>
      <div class="src off"><b>Statistics provider</b><span>Phase 2 · not chosen</span><small>Player and team match statistics and history (licence to be confirmed).</small></div></div></section>
    <section class="card"><h2>Add to your iPhone Home Screen</h2><ol class="doc"><li>Open The EV Hub in <b>Safari</b>.</li><li>Tap the <b>Share</b> button.</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol><p class="xs muted">It then opens full screen like an app and works offline with the demo data.</p></section>
    <section class="card"><h2>Reset</h2><div class="toolbar"><button type="button" class="btn" data-reset="filters">Reset Explorer filters</button><button type="button" class="btn" data-reset="presets">Delete filter presets</button><button type="button" class="btn" data-reset="all">Reset everything</button></div></section>
    <p class="xs muted">The EV Hub ${esc(EV.VERSION)} · Phase 1 demo. Not a bookmaker; no bets are taken or placed.</p>`; };
  draw();
  EV.bindChips(root, (n, v) => { if (n === 'myBooks') S.myBooks = v; else if (n === 'kellyDiv') S.kellyDiv = Number(v); else S[n] = v; EV.saveSettings(); if (n === 'oddsFmt') EV.toast('Odds format changed.'); });
  root.addEventListener('change', e => { const k = e.target.dataset.s; if (k) { S[k] = EV.num(e.target.value) ?? S[k]; EV.saveSettings(); } });
  root.addEventListener('click', e => { const b = e.target.closest('[data-reset]'); if (!b) return; const k = b.dataset.reset;
    if (k === 'filters') { EV.filters = { ...EV.DEF_FILTERS }; EV.saveFilters(); EV.toast('Explorer filters reset.'); }
    if (k === 'presets') { EV.savePresets([]); EV.toast('Presets deleted.'); }
    if (k === 'all') { try { Object.keys(localStorage).filter(x => x.startsWith('evhub.')).forEach(x => localStorage.removeItem(x)); sessionStorage.clear(); } catch { /* fine */ } EV.resetSettings(); EV.filters = { ...EV.DEF_FILTERS }; EV.toast('Everything reset.'); EV.rerender(root, EV.viewSettings); } });
};
})();

EV.route = () => {

  EV.$$('[data-nav]').forEach(a => { const on = a.dataset.nav === page || (page === 'player' && a.dataset.nav === 'players') || (page === 'team' && a.dataset.nav === 'teams') || (page === 'fixture' && a.dataset.nav === 'fixtures'); a.classList.toggle('on', on); on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); });

})();

(function () { var go = function () { try { window.EV.buildData(); window.EV.start(); } catch (e) { console.error(e); document.body.innerHTML = '<div style="padding:24px;color:#fff;font-family:sans-serif"><h1>The EV Hub</h1><p>The demo could not start: ' + String(e && e.message || e).replace(/</g, '&lt;') + '</p></div>'; } }; setTimeout(go, 30); })();
